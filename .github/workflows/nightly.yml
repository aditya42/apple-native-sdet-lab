name: Nightly Reliability

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Reliability iterations
        required: false
        default: "25"
  schedule:
    - cron: "30 18 * * 1-5"

permissions:
  contents: read

jobs:
  reliability:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make bootstrap
      - name: Run reliability loop
        env:
          RUNS: ${{ github.event.inputs.runs || '25' }}
        run: bash ./scripts/run-reliability.sh
      - name: Persist reliability observations
        if: always()
        run: |
          if [ -f reports/reliability/summary.csv ]; then
            python3 Tools/failure-history/import_reliability.py reports/reliability/summary.csv --db reports/history.sqlite
            python3 Tools/failure-history/history.py --db reports/history.sqlite --output reports/flaky-scores.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-results
          path: reports/
