name: ContactLab
options:
  bundleIdPrefix: com.example.sdetlab
  deploymentTarget:
    iOS: "17.0"
packages:
  ContactDomain:
    path: Packages/ContactDomain
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  ContactLab:
    type: application
    platform: iOS
    sources:
      - ContactLab
    dependencies:
      - package: ContactDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sdetlab.ContactLab
        INFOPLIST_KEY_CFBundleDisplayName: ContactLab
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    scheme:
      testTargets:
        - ContactLabTests
        - ContactLabUITests
      gatherCoverageData: true
  ContactLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ContactLabTests
    dependencies:
      - target: ContactLab
      - package: ContactDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sdetlab.ContactLabTests
  ContactLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ContactLabUITests
    dependencies:
      - target: ContactLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sdetlab.ContactLabUITests
